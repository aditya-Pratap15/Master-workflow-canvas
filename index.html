<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Master Workflow Canvas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Canvas Element -->
  <canvas id="infinite-canvas"></canvas>

  <!-- Top-Left Tab Navigation & Lock Options -->
  <div class="top-nav-bar">
    <div class="tabs-wrapper" id="tabs-wrapper">
      <div class="tabs-list" id="tabs-list">
        <!-- Dynamically rendered tabs -->
      </div>
      
      <!-- Circular Plus Button for New Tab -->
      <button id="add-tab-btn" class="circular-btn add-btn" title="Add New Tab" aria-label="Add new tab">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
      </button>

      <!-- Mini Lock Button Beside Plus Button -->
      <button id="lock-tab-btn" class="circular-btn lock-btn" title="Tab Options & Cloud Persistence" aria-label="Tab save and options">
        <svg id="lock-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path id="lock-shackle" d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
      </button>
    </div>

    <!-- Minimalist Lock / Tab Options Popup -->
    <div id="lock-popup" class="lock-popup hidden" role="dialog" aria-labelledby="popup-tab-title">
      <div class="popup-header">
        <div class="popup-title-row">
          <span id="popup-tab-title" class="popup-tab-name">Tab 1</span>
          <span id="popup-status-badge" class="popup-status-badge">Temporary</span>
        </div>
        <p class="popup-subtitle">Cross-device sync & permanent storage</p>
      </div>

      <div class="popup-actions">
        <!-- Local Permanent Save -->
        <button id="popup-save-btn" class="popup-action-btn btn-save" title="Save permanently in this browser">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
            <polyline points="17 21 17 13 7 13 7 21"></polyline>
            <polyline points="7 3 7 8 15 8"></polyline>
          </svg>
          <span id="popup-save-label">Save this tab (Local)</span>
        </button>

        <!-- Push to GitHub (Cross-Device) -->
        <button id="popup-github-sync-btn" class="popup-action-btn btn-github" title="Push permanently to GitHub repo for all devices">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/>
          </svg>
          <span id="popup-github-label">Push to GitHub (All Devices)</span>
        </button>

        <!-- GitHub Token Settings Accordion -->
        <div id="github-settings-panel" class="github-settings-panel hidden">
          <label class="github-label" for="github-pat-input">GitHub Token (Fine-grained PAT):</label>
          <div class="github-input-group">
            <input type="password" id="github-pat-input" placeholder="github_pat_..." class="github-pat-input" spellcheck="false" autocomplete="off" />
            <button id="save-token-btn" class="github-save-token-btn">Save</button>
          </div>
          <span class="github-hint">Requires Contents: Read & Write for repository. Saved locally on this browser.</span>
        </div>

        <!-- Cross-Device Shareable Link -->
        <button id="popup-share-link-btn" class="popup-action-btn btn-share" title="Copy instant shareable link to open on any device">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
          </svg>
          <span>Copy Cross-Device Link</span>
        </button>

        <!-- Delete Tab -->
        <button id="popup-delete-btn" class="popup-action-btn btn-delete">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="3 6 5 6 21 6"></polyline>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
          </svg>
          <span>Delete this tab</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Navigation / Zoom HUD (Bottom-Right) -->
  <div class="hud-controls">
    <button id="zoom-out-btn" class="hud-btn" title="Zoom Out ( - )" aria-label="Zoom Out">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="5" y1="12" x2="19" y2="12"></line></svg>
    </button>
    <button id="zoom-reset-btn" class="hud-btn zoom-level-display" title="Reset to 100% ( 0 )" aria-label="Reset Zoom">
      <span id="zoom-value">100%</span>
    </button>
    <button id="zoom-in-btn" class="hud-btn" title="Zoom In ( + )" aria-label="Zoom In">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
    </button>
    <div class="hud-divider"></div>
    <button id="recenter-btn" class="hud-btn" title="Recenter Origin" aria-label="Recenter Canvas">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M3 12h3m12 0h3M12 3v3m0 12v3"></path>
      </svg>
    </button>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="toast hidden" aria-live="polite"></div>

  <script src="canvas.js"></script>
</body>
</html>
